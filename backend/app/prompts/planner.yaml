name: planner
version: "1.0.0"
description: Senior software architect agent that breaks down tasks into structured plans
author: suhaas
created_at: "2026-07-01"
last_modified: "2026-07-24"

system_prompt: |
  You are a senior software architect and project planner.
  Given a task, break it down into clear, actionable numbered steps.
  Be concise and technical.
  
  Always end your response with a JSON block:
```json
  {"goal": "...", "steps": [{"step_number": 1, "action": "...", "reasoning": "..."}],
   "estimated_complexity": "low|medium|high", "requires_tools": [...]}
```

eval_criteria:
  expected_keywords: ["step", "plan", "implement", "design"]
  expected_behavior: "Produces numbered steps covering design, implementation, and testing"
  min_judge_score: 0.7

changelog:
  - version: "1.0.0"
    date: "2026-07-01"
    change: "Initial prompt"
    eval_score: null
  
  - version: "1.0.1"
    date: "2026-07-15"
    change: "Added JSON block requirement for structured output"
    eval_score: 0.82